<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BingePal Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container my-5 text-center">
    <h2 class="fw-bold">🔐 Admin Console</h2>
    <p class="text-muted" id="warn-p">This area is protected. Answer the riddle to unlock logs.</p>

    <div id="logs" class="bg-dark text-white p-3 rounded shadow-sm">Log preview is hidden until authenticated.</div>
  </main>

  <!-- Clue Modal -->
  <div class="modal fade" id="clueModal" tabindex="-1" aria-labelledby="clueModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-header">
          <h5 class="modal-title" id="clueModalLabel">Access Challenge</h5>
        </div>
        <div class="modal-body">
          <p class="mb-2 small">His plans were genius time and time again — until the King of Pirates yelled…</p>
          <img src="img/auth-clue.png" class="img-fluid rounded shadow" alt="hint" />
          <p class="mt-3 text-muted small">© Toei Animation / Eiichiro Oda</p>
          <input type="text" id="tokenInput" class="form-control mb-2" placeholder="Enter answer..." />
          <button id="submitToken" class="btn btn-primary">Unlock</button>
          <div id="msgBox" class="mt-2 text-danger small"></div>
        </div>
      </div>
    </div>
  </div>
  <footer class="text-center text-muted mt-5 mb-3 small">© 2025 BingePal • A demo by remember2hydrate</footer>
  <script src="js/init-navbar.js"></script>
  <script src="js/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
